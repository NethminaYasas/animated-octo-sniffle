language: en-GB

reviews:
  path_instructions:
    - path: "supabase/migrations/**"
      instructions: |
        Scrutinise RLS correctness above all else. For every table, check that
        RLS is enabled and that explicit policies exist for each intended
        operation. Look for:
        - missing or overly broad SELECT/INSERT/UPDATE/DELETE policies;
        - USING vs WITH CHECK mistakes;
        - privilege escalation through column grants, SECURITY DEFINER
          functions, unqualified search_path, or helper functions exposed in
          the public schema;
        - direct INSERT/UPDATE paths that bypass a server action's checks;
        - triggers that write audit rows and then raise (the write rolls back);
        - cursor pagination that uses OFFSET;
        - rate-limit counters that are not atomic or do not reset per window;
        - notification recipients that can be supplied by a client;
        - soft-deleted content that remains visible or keeps sensitive excerpts.
        Never suggest weakening a policy just to make a test pass.
    - path: "src/lib/auth/**"
      instructions: |
        Check authentication and authorization carefully: session handling,
        server-side re-checks of role and ban state, secret exposure, Turnstile
        verification, redirect validation, and whether any client-supplied role,
        recipient, author id or ban flag is trusted.
    - path: "src/lib/forum/**"
      instructions: |
        Check server actions for missing authentication/authorization, input
        validation, HTML sanitisation, rate-limit error handling, notification
        recipient derivation from database rows, and accidental leakage of raw
        database records to the client.
    - path: "src/lib/moderation/**"
      instructions: |
        Check that every staff action goes through the audited RPC, re-checks
        the caller's live role and ban state, requires a reason, enforces the
        moderator/admin hierarchy, protects the last admin, and never accepts
        an actor id or role from the client.
    - path: "src/lib/reports/**"
      instructions: |
        Check report target validation, open-report deduplication, rate-limit
        handling, and that reporters cannot read other reporters' rows or the
        staff-only resolution table.
    - path: "src/app/moderation/**"
      instructions: |
        Check that staff/admin pages are server-gated by the database role, not
        by client state, and that forms surface RPC errors without suggesting
        that an action succeeded.
    - path: "src/lib/media/**"
      instructions: |
        Scrutinise the upload pipeline: the browser must never reach the
        provider directly, file type must come from magic bytes (never the
        extension or client MIME), the size cap must be enforced while
        streaming, image metadata (EXIF/GPS) must be stripped before upload,
        the hash blocklist must be checked, provider errors must not leak to
        users, and no uploads row may be left half-written on failure. Check
        that the provider stays behind the UploadProvider interface.
    - path: "src/app/api/uploads/**"
      instructions: |
        Check authentication, effective-ban handling, same-origin enforcement
        for cookie-authenticated requests, streaming limits, quota ordering,
        and that the route never trusts client-supplied MIME types or filenames.
    - path: "src/lib/crypto/**"
      instructions: |
        Phase 5 DM crypto. Scrutinise key generation and storage, private-key
        wrapping, KDF choice and parameters, nonce uniqueness/reuse, AES-GCM
        authentication, ECDH usage, key-change warnings, and whether any
        plaintext or private key can reach the server or logs.
    - path: "src/lib/dm/**"
      instructions: |
        Phase 5 DM code. Check that the server only sees ciphertext, nonces,
        counters and metadata; that RLS restricts conversations to the two
        participants; that blocked/banned users cannot send; and that reports
        only contain user-supplied decrypted evidence.
    - path: "tests/**"
      instructions: |
        Check that tests exercise real RLS through PostgREST or an
        authenticated database role, not service-role shortcuts. Flag tests
        that create a false sense of security by bypassing RLS.
    - path: "src/app/modmail/**"
      instructions: |
        Check member-facing modmail pages: tickets are scoped to the member's
        own member_id, staff IDs (assignee_id, opened_by, closed_by, author_id)
        are never exposed, my_tickets()/my_messages() return safe columns only,
        ban appeals are gated to banned/recently-banned members, open-ticket cap
        is enforced, replies respect status transitions and rate limits, and
        closed tickets reject replies.
    - path: "src/app/moderation/modmail/**"
      instructions: |
        Check staff modmail pages: staff cannot access tickets where they are
        member_id or subject_user_id, admin_only tickets restricted to admins,
        conflict rules enforced in can_staff_access_ticket and every RPC, status
        state-machine validations, assign_ticket validates staff assignee and
        conflicts, escalate_ticket is admin-only, and internal notes are never
        exposed to members.
    - path: "src/lib/modmail/**"
      instructions: |
        Check modmail server actions and RPCs: all functions are SECURITY DEFINER
        with pinned search_path, actor derived from auth.uid() or explicit service
        role parameter (never client-supplied), rate limits use consume_posting_rate_limit
        with modmail/modmail_staff/modmail_appeal buckets, ban appeals use modmail_appeal
        bucket (1 per 24h), open_ticket caps at 5 non-appeal tickets, reopen once
        within 7 days, and expire_modmail_tickets is service-role only.
    - path: "supabase/migrations/20261108**"
      instructions: |
        Check modmail migrations: all tables RLS-enabled with explicit policies,
        no direct anon/authenticated grants, can_staff_access_ticket and
        can_staff_access_ticket_for enforce conflict rules, consume_posting_rate_limit
        restored with effective ban check (is_banned AND not expired), and
        no unintended replacement of earlier Phase 1-3 functions.
